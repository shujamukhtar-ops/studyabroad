services:
  postgres:
    # pgvector/pgvector:pg16 = the official postgres:16 image with the pgvector extension
    # preinstalled (see backend/migrations/1700000004000_add-essay-examples-vector.js,
    # which runs CREATE EXTENSION vector — plain postgres:16-alpine doesn't ship it).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyabroad
      POSTGRES_PASSWORD: studyabroad
      POSTGRES_DB: studyabroad
    ports:
      - '5433:5432' # host 5433 to avoid clashing with a system-wide Postgres on 5432
    volumes:
      - studyabroad_pgdata:/var/lib/postgresql/data

volumes:
  studyabroad_pgdata:
